<line x1="500" y1="380" x2="250" y2="445" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="380" x2="600" y2="445" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
