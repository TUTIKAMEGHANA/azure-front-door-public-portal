<text x="250" y="540" text-anchor="middle" font-family="Arial" font-size="15">Static HTML where suitable</text>

<rect x="450" y="445" width="300" height="120" rx="18" fill="#ffffff" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Azure WAF</text>
